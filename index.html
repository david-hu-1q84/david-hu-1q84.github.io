</script>

<script>
(function () {
  var cfg = window.__CHAT_CONFIG__ || {};
  var messagesEl = document.getElementById('cw-messages');
  var inputEl = document.getElementById('cw-input');
  var sendBtn = document.getElementById('cw-send');
  var stopBtn = document.getElementById('cw-stop');
  var refreshBtn = document.getElementById('cw-refresh');
  var chipsEl = document.getElementById('cw-chips');

  var history = [];
  var streaming = false;
  var controller = null;

  document.getElementById('cw-title').textContent = cfg.title || 'ASK';
  document.getElementById('cw-sub').textContent = cfg.model ? (cfg.model + ' · 在线') : '在线';

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function renderMarkdown(text) {
    if (typeof marked === 'undefined') return escapeHtml(text).replace(/\n/g, '<br>');
    var token = 'X' + Math.random().toString(36).slice(2) + 'X';
    var math = [];
    text = text.replace(/\$\$([\s\S]+?)\$\$/g, function (m, t) {
      math.push(['display', t.trim()]);
      return token + 'M' + (math.length - 1) + token;
    });
    text = text.replace(/(^|[^\\$])\$([^$\n]+?)\$/g, function (m, p, t) {
      math.push(['inline', t.trim()]);
      return p + token + 'M' + (math.length - 1) + token;
    });
    var html = marked.parse(text);
    html = html.replace(new RegExp(token + 'M(\\d+)' + token, 'g'), function (m, i) {
      var item = math[+i];
      if (typeof katex === 'undefined') return '<code>' + escapeHtml(item[1]) + '</code>';
      try {
        return katex.renderToString(item[1], { displayMode: item[0] === 'display', throwOnError: false });
      } catch (e) {
        return '<code>' + escapeHtml(item[1]) + '</code>';
      }
    });
    return html;
  }

  function scrollToBottom() { messagesEl.scrollTop = messagesEl.scrollHeight; }

  function addMessage(role, content, opts) {
    opts = opts || {};
    var msg = document.createElement('div');
    msg.className = 'cw-msg ' + role;
    var bubble = document.createElement('div');
    bubble.className = 'cw-bubble';
    if (opts.thinking) {
      bubble.innerHTML = '<div class="cw-thinking"><span></span><span></span><span></span></div>';
    } else if (opts.raw) {
      var streamEl = document.createElement('div');
      streamEl.className = 'cw-streaming';
      streamEl.textContent = content;
      bubble.appendChild(streamEl);
    } else {
      bubble.innerHTML = renderMarkdown(content);
    }
    msg.appendChild(bubble);
    messagesEl.appendChild(msg);
    scrollToBottom();
    return msg;
  }

  function addWelcome() { if (cfg.welcome) addMessage('assistant', cfg.welcome); }

  function buildRequestBody() {
    var messages = [];
    if (cfg.systemPrompt) messages.push({ role: 'system', content: cfg.systemPrompt });
    messages = messages.concat(history);
    return { model: cfg.model, stream: true, messages: messages };
  }

  function setStreaming(on) {
    streaming = on;
    sendBtn.disabled = on;
    sendBtn.classList.toggle('cw-hidden', on);
    stopBtn.classList.toggle('cw-hidden', !on);
    inputEl.disabled = on;
  }

  function send() {
    if (streaming) return;
    var text = inputEl.value.trim();
    if (!text) return;
    inputEl.value = '';
    autoGrow();

    history.push({ role: 'user', content: text });
    addMessage('user', text);

    var assistantMsg = addMessage('assistant', '', { thinking: true });
    var bubble = assistantMsg.querySelector('.cw-bubble');
    var raw = '';
    var started = false;

    controller = new AbortController();
    setStreaming(true);

    var headers = { 'Content-Type': 'application/json' };
    if (cfg.key) headers['X-Chat-Key'] = cfg.key;

    fetch(cfg.apiBase + '/chat/completions', {
      method: 'POST',
      signal: controller.signal,
      headers: headers,
      body: JSON.stringify(buildRequestBody())
    }).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var reader = res.body.getReader();
      var decoder = new TextDecoder();
      var buffer = '';

      function pump() {
        return reader.read().then(function (result) {
          if (result.done) return;
          buffer += decoder.decode(result.value, { stream: true });
          var lines = buffer.split('\n');
          buffer = lines.pop() || '';
          lines.forEach(function (line) {
            var t = line.trim();
            if (t.indexOf('data:') !== 0) return;
            var payload = t.slice(5).trim();
            if (payload === '[DONE]') return;
            try {
              var json = JSON.parse(payload);
              var delta = json.choices && json.choices[0] && json.choices[0].delta && json.choices[0].delta.content;
              if (delta) {
                if (!started) {
                  started = true;
                  bubble.innerHTML = '';
                  var s = document.createElement('div');
                  s.className = 'cw-streaming';
                  bubble.appendChild(s);
                }
                raw += delta;
                bubble.querySelector('.cw-streaming').textContent = raw;
                scrollToBottom();
              }
            } catch (e) {}
          });
          return pump();
        });
      }

      return pump().then(function () {
        if (!raw) raw = '（无回复）';
        history.push({ role: 'assistant', content: raw });
        bubble.innerHTML = renderMarkdown(raw);
        scrollToBottom();
        setStreaming(false);
      });
    }).catch(function (err) {
      if (err.name === 'AbortError') {
        if (raw) {
          history.push({ role: 'assistant', content: raw });
          bubble.innerHTML = renderMarkdown(raw);
        } else {
          assistantMsg.remove();
        }
      } else {
        assistantMsg.remove();
        addMessage('error', '请求失败：' + err.message + '。请确认本地 Ollama 已启动。');
      }
      setStreaming(false);
    });
  }

  function stop() { if (controller) controller.abort(); }

  function autoGrow() {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  }

  // 预设问题：每次展示 3 个，可刷新轮换
  var qPool = (cfg.questions && cfg.questions.length) ? cfg.questions : [];
  var qStart = 0;
  function renderQuestions() {
    chipsEl.innerHTML = '';
    if (!qPool.length) return;
    var shown = qPool.slice(qStart, qStart + 3);
    for (var i = 0; i < shown.length; i++) {
      (function (q) {
        var b = document.createElement('button');
        b.className = 'cw-chip';
        b.innerHTML = '<span class="cw-chip-arrow">↳</span><span>' + escapeHtml(q) + '</span>';
        b.addEventListener('click', function () { inputEl.value = q; send(); });
        chipsEl.appendChild(b);
      })(shown[i]);
    }
  }

  sendBtn.addEventListener('click', send);
  stopBtn.addEventListener('click', stop);
  refreshBtn.addEventListener('click', function () {
    qStart = (qStart + 3) % qPool.length;
    renderQuestions();
  });
  inputEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  inputEl.addEventListener('input', autoGrow);

  renderQuestions();
  addWelcome();
})();
</script>
