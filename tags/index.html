<script>
window.__CHAT_CONFIG__ = {"enabled":true,"apiBase":"http://localhost:11434/v1","model":"llama3","key":"","title":"和胡希国聊聊","welcome":"你好，我是胡希国的 AI 助手，了解他的教育背景、工作经历和技能，问我关于他的问题吧～","systemPrompt":"你是「胡希国」的数字分身，负责在他的个人主页回答访客关于他的问题。用自然、专业、友好的中文回答，未知信息请如实说明。你了解他的信息：\n- 姓名：胡希国（Hu Xiguo），邮箱 uestc.hugo@gmail.com，现居北京\n- 教育：电子科技大学（UESTC）通信工程，本科 2014-2018，硕士 2018-2021\n- 工作：百度云原生团队研发工程师（2021.7 至今）\n  · bRPC 框架：贡献代码 5k+，独立完成无损热升级与框架级 Tracing；影响内部模块 4000+、线上实例 600w+；Apache bRPC Committer 与 Release Manager\n  · 服务网格：CloudServiceMesh 托管网关（CSM Gateway）设计实现；Multi-Buffer TLS 硬件加速\n  · 文心一言/千帆：安全红线模块重构；千帆大模型推理调度 Dispatch 流式接口\n  · 其他：BCI 容器实例、CHPC 高性能计算\n- 技能：C++/Golang/Python；RPC、微服务、云原生服务网格、大模型推理请求调度；K8s、容器网络、Serverless\n- 性格：INTJ，计划性强，自我驱动\n回答要简洁友好，像他本人一样专业。\n"};
</script>

<script>
(function () {
  var cfg = window.__CHAT_CONFIG__ || {};
  var root = document.getElementById('cw-root');
  var fab = document.getElementById('cw-fab');
  var messagesEl = document.getElementById('cw-messages');
  var inputEl = document.getElementById('cw-input');
  var sendBtn = document.getElementById('cw-send');
  var stopBtn = document.getElementById('cw-stop');
  var clearBtn = document.getElementById('cw-clear');
  var closeBtn = document.getElementById('cw-close');

  var history = [];
  var streaming = false;
  var controller = null;

  document.getElementById('cw-title').textContent = cfg.title || 'AI 助手';
  document.getElementById('cw-sub').textContent = cfg.model || '在线';

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function renderMarkdown(text) {
    if (typeof marked === 'undefined') return escapeHtml(text).replace(/\n/g, '<br>');
    var token = 'X' + Math.random().toString(36).slice(2) + 'X';
    var math = [];
    text = text.replace(/\$\$([\s\S]+?)\$\$/g, function (m, t) {
      math.push(['display', t.trim()]);
      return token + 'M' + (math.length - 1) + token;
    });
    text = text.replace(/(^|[^\\$])\$([^$\n]+?)\$/g, function (m, p, t) {
      math.push(['inline', t.trim()]);
      return p + token + 'M' + (math.length - 1) + token;
    });
    var html = marked.parse(text);
    html = html.replace(new RegExp(token + 'M(\\d+)' + token, 'g'), function (m, i) {
      var item = math[+i];
      if (typeof katex === 'undefined') return '<code>' + escapeHtml(item[1]) + '</code>';
      try {
        return katex.renderToString(item[1], { displayMode: item[0] === 'display', throwOnError: false });
      } catch (e) {
        return '<code>' + escapeHtml(item[1]) + '</code>';
      }
    });
    return html;
  }

  function scrollToBottom() { messagesEl.scrollTop = messagesEl.scrollHeight; }

  function addMessage(role, content, opts) {
    opts = opts || {};
    var msg = document.createElement('div');
    msg.className = 'cw-msg ' + role;
    if (role !== 'user') {
      var bot = document.createElement('div');
      bot.className = 'cw-bot-avatar';
      bot.textContent = '胡';
      msg.appendChild(bot);
    }
    var bubble = document.createElement('div');
    bubble.className = 'cw-bubble';
    if (opts.thinking) {
      bubble.innerHTML = '<div class="cw-thinking"><span></span><span></span><span></span></div>';
    } else if (opts.raw) {
      var streamEl = document.createElement('div');
      streamEl.className = 'cw-streaming';
      streamEl.textContent = content;
      bubble.appendChild(streamEl);
    } else {
      bubble.innerHTML = renderMarkdown(content);
    }
    msg.appendChild(bubble);
    messagesEl.appendChild(msg);
    scrollToBottom();
    return msg;
  }

  function addWelcome() { if (cfg.welcome) addMessage('assistant', cfg.welcome); }

  function clearConversation() {
    if (streaming) return;
    history = [];
    messagesEl.innerHTML = '';
    addWelcome();
  }

  function buildRequestBody() {
    var messages = [];
    if (cfg.systemPrompt) messages.push({ role: 'system', content: cfg.systemPrompt });
    messages = messages.concat(history);
    return { model: cfg.model, stream: true, messages: messages };
  }

  function setStreaming(on) {
    streaming = on;
    sendBtn.disabled = on;
    sendBtn.classList.toggle('cw-hidden', on);
    stopBtn.classList.toggle('cw-hidden', !on);
    inputEl.disabled = on;
  }

  function send() {
    if (streaming) return;
    var text = inputEl.value.trim();
    if (!text) return;
    inputEl.value = '';
    autoGrow();

    history.push({ role: 'user', content: text });
    addMessage('user', text);

    var assistantMsg = addMessage('assistant', '', { thinking: true });
    var bubble = assistantMsg.querySelector('.cw-bubble');
    var raw = '';
    var started = false;

    controller = new AbortController();
    setStreaming(true);

    var headers = { 'Content-Type': 'application/json' };
    if (cfg.key) headers['X-Chat-Key'] = cfg.key;

    fetch(cfg.apiBase + '/chat/completions', {
      method: 'POST',
      signal: controller.signal,
      headers: headers,
      body: JSON.stringify(buildRequestBody())
    }).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var reader = res.body.getReader();
      var decoder = new TextDecoder();
      var buffer = '';

      function pump() {
        return reader.read().then(function (result) {
          if (result.done) return;
          buffer += decoder.decode(result.value, { stream: true });
          var lines = buffer.split('\n');
          buffer = lines.pop() || '';
          lines.forEach(function (line) {
            var t = line.trim();
            if (t.indexOf('data:') !== 0) return;
            var payload = t.slice(5).trim();
            if (payload === '[DONE]') return;
            try {
              var json = JSON.parse(payload);
              var delta = json.choices && json.choices[0] && json.choices[0].delta && json.choices[0].delta.content;
              if (delta) {
                if (!started) {
                  started = true;
                  bubble.innerHTML = '';
                  var s = document.createElement('div');
                  s.className = 'cw-streaming';
                  bubble.appendChild(s);
                }
                raw += delta;
                bubble.querySelector('.cw-streaming').textContent = raw;
                scrollToBottom();
              }
            } catch (e) {}
          });
          return pump();
        });
      }

      return pump().then(function () {
        if (!raw) raw = '（无回复）';
        history.push({ role: 'assistant', content: raw });
        bubble.innerHTML = renderMarkdown(raw);
        scrollToBottom();
        setStreaming(false);
      });
    }).catch(function (err) {
      if (err.name === 'AbortError') {
        if (raw) {
          history.push({ role: 'assistant', content: raw });
          bubble.innerHTML = renderMarkdown(raw);
        } else {
          assistantMsg.remove();
        }
      } else {
        assistantMsg.remove();
        addMessage('error', '请求失败：' + err.message + '。请确认本地 Ollama 已启动。');
      }
      setStreaming(false);
    });
  }

  function stop() { if (controller) controller.abort(); }

  function autoGrow() {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 130) + 'px';
  }

  fab.addEventListener('click', function () {
    var open = root.classList.toggle('cw-open');
    root.setAttribute('aria-hidden', String(!open));
    if (open) inputEl.focus();
  });
  closeBtn.addEventListener('click', function () {
    root.classList.remove('cw-open');
    root.setAttribute('aria-hidden', 'true');
  });
  clearBtn.addEventListener('click', clearConversation);
  sendBtn.addEventListener('click', send);
  stopBtn.addEventListener('click', stop);
  inputEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  inputEl.addEventListener('input', autoGrow);

  addWelcome();
})();
</script>
